<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>html-preview-hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231a1917'/><path d='M9 11h14M9 16h9M9 21h12' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="app" id="app" data-view="home">

  <!-- ヘッダー -->
  <header class="topbar">
    <div class="topbar__left">
      <button class="brand" id="brand" type="button" title="ホームへ戻る">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M4 7h16M4 12h10M4 17h13"/>
          </svg>
        </span>
        <span class="brand__title" id="brandTitle">html-preview-hub</span>
      </button>
      <span class="brand__meta" id="brandMeta"></span>
    </div>
    <div class="topbar__right">
      <button class="pill pill--ghost" id="labelModeToggle" type="button">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 7V5h14v2M12 5v14M9.5 19h5"/>
        </svg>
        <span id="labelModeLabel">タイトル</span>
      </button>
      <button class="pill pill--ghost" id="favoritesToggle" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
          <path d="M12 4l2.4 5 5.6.8-4 3.9 1 5.5-5-2.7-5 2.7 1-5.5-4-3.9 5.6-.8z"/>
        </svg>
        <span id="favoritesLabel">お気に入り</span>
      </button>
      <button class="icon-btn" id="settingsBtn" type="button" title="設定 (,)" aria-label="設定">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9">
          <circle cx="12" cy="12" r="3.1"/>
          <path d="M19.4 13.5a7.6 7.6 0 000-3l1.7-1.3-1.9-3.3-2 .8a7.7 7.7 0 00-2.6-1.5L14.3 3H9.7l-.3 2.2a7.7 7.7 0 00-2.6 1.5l-2-.8-1.9 3.3 1.7 1.3a7.6 7.6 0 000 3l-1.7 1.3 1.9 3.3 2-.8a7.7 7.7 0 002.6 1.5l.3 2.2h4.6l.3-2.2a7.7 7.7 0 002.6-1.5l2 .8 1.9-3.3z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ホーム: フォルダカード一覧 -->
  <main class="home" id="homeView">
    <div class="home__inner">
      <div class="toolbar">
        <div class="search">
          <svg class="search__icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5" stroke-linecap="round"/>
          </svg>
          <input id="homeSearch" class="search__input" type="search" autocomplete="off" spellcheck="false"
                 placeholder="フォルダ名・ファイル名で検索" aria-label="検索">
          <kbd class="search__kbd">/</kbd>
        </div>
        <div class="chips" id="sortChips" role="group" aria-label="並び替え"></div>
        <div class="chips" id="kindChips" role="group" aria-label="種類で絞り込み"></div>
        <button class="chip" id="hiddenChip" type="button" aria-pressed="false"></button>
      </div>

      <div class="grid" id="folderGrid" role="list"></div>
      <div class="grid-sentinel" id="gridSentinel" aria-hidden="true"></div>
      <div class="empty" id="homeEmpty" hidden></div>
    </div>
  </main>

  <!-- プレビュー: サイドバー + iframe -->
  <main class="workspace" id="previewView">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__head">
        <button class="icon-btn icon-btn--sm" id="backBtn" type="button" title="一覧へ戻る (Esc)" aria-label="一覧へ戻る">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 5l-7 7 7 7"/>
          </svg>
        </button>
        <div class="search search--sm">
          <input id="treeSearch" class="search__input" type="search" autocomplete="off" spellcheck="false"
                 placeholder="ファイルを検索" aria-label="ファイル検索">
        </div>
      </div>
      <div class="sidebar__list" id="treeScroller" tabindex="0">
        <div class="vlist" id="treeViewport"><div class="vlist__spacer" id="treeSpacer"></div><div class="vlist__rows" id="treeRows"></div></div>
      </div>
      <div class="sidebar__foot" id="treeFoot"></div>
    </aside>
    <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" title="ドラッグで幅を調整"></div>
    <section class="preview" id="preview">
      <div class="preview__bar">
        <div class="crumbs" id="crumbs"></div>
        <div class="preview__actions">
          <button class="chip chip--sm" id="favBtn" type="button" title="お気に入り (f)">★</button>
          <button class="chip chip--sm" id="isolationBtn" type="button" title="サンドボックスの分離レベルを切り替え">分離</button>
          <button class="chip chip--sm" id="sourceBtn" type="button" title="ソース表示 (u)">ソース</button>
          <button class="chip chip--sm" id="logBtn" type="button" title="コンパイルログ (l)" hidden>ログ</button>
          <button class="chip chip--sm" id="reloadBtn" type="button" title="再読み込み (r)">再読込</button>
          <button class="chip chip--sm" id="externalBtn" type="button" title="既定のブラウザで開く">外部で開く</button>
        </div>
      </div>
      <div class="preview__stage" id="stage">
        <div class="preview__placeholder" id="previewPlaceholder">左の一覧からファイルを選択してください</div>
        <div class="preview__error" id="previewError" hidden></div>
        <pre class="preview__source" id="previewSource" hidden></pre>
        <pre class="preview__source preview__log" id="previewLog" hidden></pre>
        <div class="preview__status" id="previewStatus" hidden></div>
      </div>
    </section>
  </main>

  <!-- 設定モーダル -->
  <div class="modal" id="settingsModal" hidden>
    <div class="modal__backdrop" data-close="1"></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-label="設定">
      <div class="modal__head">
        <h2 class="modal__title">対象フォルダ</h2>
        <button class="icon-btn icon-btn--sm" data-close="1" type="button" aria-label="閉じる">✕</button>
      </div>
      <div class="modal__body" id="settingsBody"></div>
      <div class="modal__foot">
        <span class="modal__hint" id="configPathHint"></span>
        <button class="pill pill--solid" id="rescanBtn" type="button">再スキャン</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
</div>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
