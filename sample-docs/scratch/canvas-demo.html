<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Canvas アニメーションの使い捨てデモ</title></head>
<body style="margin:0;background:#12110f">
<canvas id="c" style="display:block;width:100vw;height:100vh"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
function resize() { c.width = innerWidth; c.height = innerHeight; }
addEventListener('resize', resize); resize();
let t = 0;
(function loop() {
  ctx.fillStyle = 'rgba(18,17,15,0.16)'; ctx.fillRect(0, 0, c.width, c.height);
  t += 0.02;
  for (let i = 0; i < 40; i++) {
    const x = c.width / 2 + Math.cos(t + i * 0.16) * (120 + i * 5);
    const y = c.height / 2 + Math.sin(t * 1.3 + i * 0.16) * (90 + i * 4);
    ctx.fillStyle = `hsl(${(i * 8 + t * 40) % 360} 70% 62%)`;
    ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
  }
  requestAnimationFrame(loop);
})();
</script></body></html>
